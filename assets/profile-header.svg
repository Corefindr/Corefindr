<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Nishant | ServiceNow and ITSM</title>
  <desc id="desc">Dark themed animated GitHub profile header for ServiceNow, ITSM, and automation work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="48%" stop-color="#0f3f66"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glowA" cx="20%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glowA)"/>
  <rect width="1200" height="300" fill="url(#glowB)"/>

  <g opacity="0.22">
    <path d="M-40 230 C190 145 340 280 560 190 S910 82 1240 150" fill="none" stroke="#67e8f9" stroke-width="2"/>
    <path d="M-60 258 C180 175 350 304 565 218 S900 112 1260 182" fill="none" stroke="#99f6e4" stroke-width="2"/>
    <path d="M-80 92 C155 18 320 122 520 86 S880 -6 1270 75" fill="none" stroke="#bae6fd" stroke-width="1.5"/>
  </g>

  <g opacity="0.28">
    <circle cx="120" cy="72" r="4" fill="#a5f3fc">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="84" r="5" fill="#99f6e4">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="228" r="3.5" fill="#67e8f9">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g filter="url(#softShadow)">
    <text x="600" y="118" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="0">
      Nishant
    </text>
    <text x="600" y="164" text-anchor="middle" fill="#dffcff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="27" font-weight="600" letter-spacing="0">
      ServiceNow Developer | ServiceNow BA | ITSM
    </text>
    <text x="600" y="204" text-anchor="middle" fill="#bfdbfe" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="0">
      Building cleaner service experiences for agents, teams, and business users
    </text>
  </g>

  <g transform="translate(388 236)">
    <rect x="0" y="0" width="132" height="34" rx="17" fill="#0f172a" opacity="0.72"/>
    <text x="66" y="23" text-anchor="middle" fill="#a5f3fc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700">ITSM</text>
    <rect x="148" y="0" width="180" height="34" rx="17" fill="#0f172a" opacity="0.72"/>
    <text x="238" y="23" text-anchor="middle" fill="#ccfbf1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700">ServiceNow</text>
    <rect x="344" y="0" width="186" height="34" rx="17" fill="#0f172a" opacity="0.72"/>
    <text x="437" y="23" text-anchor="middle" fill="#bfdbfe" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700">Automation</text>
  </g>
</svg>
